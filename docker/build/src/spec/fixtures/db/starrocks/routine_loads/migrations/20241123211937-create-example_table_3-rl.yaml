---
:table_name: example_table_3
:routine_name: rl_example_table_3
:db_name: schematic
:operation: :create
:columns:
- id
- created_at
- name
- description
- value
- updated_at
- category
- price
:kafka:
  :broker_list: "{{KAFKA_BROKER_LIST}}"
  :topic: example_table_3
  :partitions: "{{KAFKA_PARTITIONS}}"
  :offset: "{{KAFKA_OFFSET}}"
  :security:
    :protocol: "{{KAFKA_SECURITY_PROTOCOL}}"
    :mechanism: "{{KAFKA_SASL_MECHANISM}}"
    :username: "{{KAFKA_SASL_USERNAME}}"
    :password: "{{KAFKA_SASL_PASSWORD}}"
    :ssl_verify: "{{KAFKA_SSL_VERIFY}}"
:schema_registry:
  :url: "{{SCHEMA_REGISTRY_URL}}"
  :auth:
    :username: "{{SCHEMA_REGISTRY_USERNAME}}"
    :password: "{{SCHEMA_REGISTRY_PASSWORD}}"
:properties:
  :desired_concurrent_number: '3'
  :format: json
  :max_error_number: '0'
  :max_filter_ratio: '1.0'
  :max_batch_interval: '10'
  :max_batch_rows: '2000000'
  :task_consume_second: '15'
  :task_timeout_second: '60'
  :max_batch_size: '2000000'
  :jsonpaths:
  - "$.id"
  - "$.created_at"
  - "$.name"
  - "$.description"
  - "$.value"
  - "$.updated_at"
  - "$.category"
  - "$.price"
